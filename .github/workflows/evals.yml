name: evals

# Live evaluation of the tool surface against deps.dev. Run on demand, and
# weekly, so drift in the upstream data or API is caught as a feedback loop.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
    steps:
      - uses: actions/checkout@v6
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create virtual environment
        run: python -m venv .venv
      - name: Install dependencies
        run: |
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run evaluation suite (hits live deps.dev)
        run: .venv/bin/python -m evals.run_evals
